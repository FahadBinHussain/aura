[project]
name = "aura-scraper"
version = "0.1.0"
description = "Real scraper for the Aura wallpaper app: Cloudflare-bypassed HTML + validated, normalized image assets."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pillow>=10.3",
]

[project.scripts]
aura-scraper = "aura_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_scraper"]

[tool.uv]
package = true
